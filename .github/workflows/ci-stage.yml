# One stage of ci-build-windows.yml: restore the tree (or prepare it, in the
# first stage), build until done or until the deadline, keep the finished files
# for the release if done, and save the tree either way.
name: ci-stage

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      jobs:
        type: number
        required: true
      resume-run:
        description: Run ID whose saved tree the first stage resumes instead of preparing one
        type: string
        default: ''
    outputs:
      finished:
        value: ${{ jobs.stage.outputs.finished }}

permissions:
  contents: read
  actions: read

env:
  # D: is the runner's 150 GB temporary disk, nearly empty; C: has only about
  # 30 GB free, which the Chromium checkout alone overflows.
  THORIUM_CI_WORK: D:\b
  # Minutes from the job's start: Ninja stops here, leaving time to archive
  # and upload the tree before GitHub's 6-hour limit (timeout-minutes below).
  BUILD_UNTIL_MINUTES: 280

jobs:
  stage:
    runs-on: windows-2025-vs2026
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - name: Start the clock
        shell: pwsh
        run: |
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes($env:BUILD_UNTIL_MINUTES).ToUnixTimeSeconds()
          "DEADLINE=$deadline" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows SDK 10.0.28000
        shell: pwsh
        run: ci\install-windows-sdk.ps1

      - name: Prepare the tree
        if: inputs.stage == 1 && inputs.resume-run == ''
        run: python ci\stage.py prepare

      - name: Download the saved tree
        if: inputs.stage > 1 || inputs.resume-run != ''
        uses: actions/download-artifact@v4
        with:
          name: build-state
          path: D:\b-state
          run-id: ${{ inputs.resume-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore the saved tree
        if: inputs.stage > 1 || inputs.resume-run != ''
        shell: pwsh
        run: |
          # -snld: restore the symbolic links -snl stored, relative ones included.
          & 7z x D:\b-state\state.7z "-o$env:THORIUM_CI_WORK" -snld -y -bso0 -bsp0
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -eq 1) { "::warning::7z reported warnings restoring the tree" }
          Remove-Item -Recurse -Force D:\b-state
          exit 0  # GitHub's pwsh wrapper would otherwise exit with 7z's code

      - name: Build
        id: build
        shell: pwsh
        run: |
          python ci\stage.py build --deadline $env:DEADLINE --jobs ${{ inputs.jobs }}
          switch ($LASTEXITCODE) {
            0       { "finished=true"  >> $env:GITHUB_OUTPUT }
            124     { "finished=false" >> $env:GITHUB_OUTPUT }
            default { exit $LASTEXITCODE }
          }
          exit 0

      - name: Package
        if: steps.build.outputs.finished == 'true'
        run: python ci\stage.py package

      - name: Upload the release files
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thorium-dist
          path: D:\b\dist
          compression-level: 0
          retention-days: 7

      # The tree is saved after the last stage too, so a later run can resume
      # from the finished build (resume-run) for a fix on the same version.
      # There, a failed save must not cost the release that is already built.
      - name: Save the tree
        continue-on-error: ${{ steps.build.outputs.finished == 'true' }}
        shell: pwsh
        run: |
          # 7z keeps file times to 100 ns, which Ninja's up-to-date checks need.
          # -snl stores symbolic links as links: the checkout has some, a few of
          # them dangling, and following them made 7z fail the whole save.
          # Exit code 1 is 7z's "warnings": an unreadable file is reported, not
          # worth losing the stage's work over.
          & 7z a -t7z -mx=1 -mmt=on -snl "-xr!.git" D:\b-state\state.7z `
              "$env:THORIUM_CI_WORK\src" "$env:THORIUM_CI_WORK\depot_tools" `
              "$env:THORIUM_CI_WORK\.gclient" -bso0 -bsp0
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -eq 1) { "::warning::7z reported warnings saving the tree" }
          Get-Item D:\b-state\state.7z | ForEach-Object { "state.7z: {0:N1} GiB" -f ($_.Length / 1GB) }
          exit 0  # GitHub's pwsh wrapper would otherwise exit with 7z's code

      - name: Upload the saved tree
        continue-on-error: ${{ steps.build.outputs.finished == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-state
          path: D:\b-state\state.7z
          compression-level: 0
          # Long enough to fix a problem found in the first weeks of use without
          # a full rebuild; artifacts of a public repository cost nothing.
          retention-days: 21
          overwrite: true
