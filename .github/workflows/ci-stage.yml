# One stage of ci-build-windows.yml: restore the tree (or prepare it, in the
# first stage), build until done or until the deadline, save the tree for the
# next stage or the finished files for the release.
name: ci-stage

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      jobs:
        type: number
        required: true
      resume-run:
        description: Run ID whose saved tree the first stage resumes instead of preparing one
        type: string
        default: ''
    outputs:
      finished:
        value: ${{ jobs.stage.outputs.finished }}

permissions:
  contents: read
  actions: read

env:
  # D: is the runner's 150 GB temporary disk, nearly empty; C: has only about
  # 30 GB free, which the Chromium checkout alone overflows.
  THORIUM_CI_WORK: D:\b
  # Minutes from the job's start: Ninja stops here, leaving time to archive
  # and upload the tree before GitHub's 6-hour limit (timeout-minutes below).
  BUILD_UNTIL_MINUTES: 280

jobs:
  stage:
    runs-on: windows-2025-vs2026
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - name: Start the clock
        shell: pwsh
        run: |
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes($env:BUILD_UNTIL_MINUTES).ToUnixTimeSeconds()
          "DEADLINE=$deadline" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows SDK 10.0.28000
        shell: pwsh
        run: ci\install-windows-sdk.ps1

      - name: Prepare the tree
        if: inputs.stage == 1 && inputs.resume-run == ''
        run: python ci\stage.py prepare

      - name: Download the saved tree
        if: inputs.stage > 1 || inputs.resume-run != ''
        uses: actions/download-artifact@v4
        with:
          name: build-state
          path: D:\b-state
          run-id: ${{ inputs.resume-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore the saved tree
        if: inputs.stage > 1 || inputs.resume-run != ''
        shell: pwsh
        run: |
          & 7z x D:\b-state\state.7z "-o$env:THORIUM_CI_WORK" -y -bso0 -bsp0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force D:\b-state

      - name: Build
        id: build
        shell: pwsh
        run: |
          python ci\stage.py build --deadline $env:DEADLINE --jobs ${{ inputs.jobs }}
          switch ($LASTEXITCODE) {
            0       { "finished=true"  >> $env:GITHUB_OUTPUT }
            124     { "finished=false" >> $env:GITHUB_OUTPUT }
            default { exit $LASTEXITCODE }
          }
          exit 0

      - name: Save the tree for the next stage
        if: steps.build.outputs.finished == 'false'
        shell: pwsh
        run: |
          # 7z keeps file times to 100 ns, which Ninja's up-to-date checks need.
          & 7z a -t7z -mx=1 -mmt=on "-xr!.git" D:\b-state\state.7z `
              "$env:THORIUM_CI_WORK\src" "$env:THORIUM_CI_WORK\depot_tools" `
              "$env:THORIUM_CI_WORK\.gclient" -bso0 -bsp0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item D:\b-state\state.7z | ForEach-Object { "state.7z: {0:N1} GiB" -f ($_.Length / 1GB) }

      - name: Upload the saved tree
        if: steps.build.outputs.finished == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build-state
          path: D:\b-state\state.7z
          compression-level: 0
          retention-days: 2
          overwrite: true

      - name: Package
        if: steps.build.outputs.finished == 'true'
        run: python ci\stage.py package

      - name: Upload the release files
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thorium-dist
          path: D:\b\dist
          compression-level: 0
          retention-days: 7
